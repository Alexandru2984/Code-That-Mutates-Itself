# Loaded in the nginx http context. Only the Evolving Minds vhost uses these zones.
limit_req_zone $binary_remote_addr zone=evolving_minds_http:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=evolving_minds_admin:1m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=evolving_minds_connections:1m;
