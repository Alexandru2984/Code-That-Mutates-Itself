# Loaded in the nginx http context. Only the Evolving Minds vhost uses these zones.
limit_req_zone $binary_remote_addr zone=evolving_minds_http:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=evolving_minds_admin:1m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=evolving_minds_connections:1m;

# Administrative views never load third-party analytics or beacon scripts.
# Preserve the application's per-response nonce; fall back to a strict policy
# for errors that never reached the browser pipeline.
map $upstream_http_content_security_policy $evolving_minds_admin_csp {
    default $upstream_http_content_security_policy;
    "" "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'";
}
map $uri $evolving_minds_csp {
    default "default-src 'self'; base-uri 'self'; connect-src 'self' https://analytics.micutu.com https://cloudflareinsights.com; font-src 'self' data:; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self' https://analytics.micutu.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'";
    ~^/admin(?:/|$) $evolving_minds_admin_csp;
}
