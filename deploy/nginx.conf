server {
    include snippets/block-dotfiles.conf;
    server_name elixir.micutu.com;

    set $elixir_origin_allowed $from_cloudflare_origin;
    if ($elixir_origin_allowed = 0) {
        return 444;
    }

    client_max_body_size 64k;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn evolving_minds_connections 20;
    server_tokens off;

    # The cacheable shell contains no session or visitor-specific markup.
    # Keep analytics transformations out of its document and its strict CSP.
    location = /lab {
        limit_req zone=evolving_minds_http burst=40 nodelay;
        include /etc/nginx/snippets/evolving-minds-proxy.conf;
    }

    location = /offline {
        limit_req zone=evolving_minds_http burst=40 nodelay;
        include /etc/nginx/snippets/evolving-minds-proxy.conf;
    }

    location /admin/ {
        limit_req zone=evolving_minds_admin burst=10 nodelay;
        include /etc/nginx/snippets/evolving-minds-proxy.conf;
    }

    location / {
        limit_req zone=evolving_minds_http burst=40 nodelay;
        include /etc/nginx/snippets/evolving-minds-proxy.conf;
        sub_filter '</head>' '    <script defer src="https://analytics.micutu.com/script.js" data-website-id="f5d380f2-1d7e-4c3c-b925-134193398510"></script></head>';
        sub_filter_once on;
    }

    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy $evolving_minds_csp always;
    # /robots.txt and /sitemap.xml are served by Phoenix for this product.



    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    ssl_certificate /etc/letsencrypt/live/elixir.micutu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elixir.micutu.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:elixir_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
}

server {
    listen 80;
    listen [::]:80;
    server_name elixir.micutu.com;
    return 301 https://$host$request_uri;
}
