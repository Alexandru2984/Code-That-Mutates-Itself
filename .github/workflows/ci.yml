name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MIX_ENV: test
  ERL_FLAGS: '+S 2:2'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [evolving_minds_core, evolving_minds]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@0f75c29430f34bb5af4cce5e3b7f6a8860fca236 # v1
        with:
          elixir-version: '1.18.3'
          otp-version: '27'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ matrix.project }}/deps
            ${{ matrix.project }}/_build
          key: ${{ runner.os }}-otp27-elixir1.18-${{ matrix.project }}-${{ hashFiles('**/mix.lock') }}
      - run: mix deps.get --check-locked
      - run: mix hex.audit
      - name: Check tracked credential files and token patterns
        run: python3 ../deploy/check-tracked-secrets.py
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test --warnings-as-errors
      - name: Production assets and release
        if: matrix.project == 'evolving_minds'
        env:
          MIX_ENV: prod
          PHX_HOST: example.test
          SECRET_KEY_BASE: ci-only-placeholder-not-a-production-secret-0123456789abcdefghijklmnopqrstuvwxyz
        run: |
          mix compile --warnings-as-errors
          mix assets.deploy
          mix release
      - name: Validate deployment scripts
        if: matrix.project == 'evolving_minds'
        run: bash -n ../deploy/*.sh
