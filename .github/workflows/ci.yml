name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MIX_ENV: test
  ERL_FLAGS: '+S 2:2'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [evolving_minds_core, evolving_minds]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: '1.18.3'
          otp-version: '27'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.project == 'evolving_minds'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ matrix.project }}/deps
            ${{ matrix.project }}/_build
          key: ${{ runner.os }}-otp27-elixir1.18-${{ matrix.project }}-${{ hashFiles('**/mix.lock') }}
      - run: mix deps.get --check-locked
      - run: mix hex.audit
      - name: Check tracked credential files and token patterns
        run: python3 ../deploy/check-tracked-secrets.py
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test --warnings-as-errors
      - name: Test the deterministic browser simulation
        if: matrix.project == 'evolving_minds'
        run: node --test assets/js/*.test.mjs
      - name: Production assets and release
        if: matrix.project == 'evolving_minds'
        env:
          MIX_ENV: prod
          PHX_HOST: example.test
          SECRET_KEY_BASE: ci-only-placeholder-not-a-production-secret-0123456789abcdefghijklmnopqrstuvwxyz
        run: |
          mix compile --warnings-as-errors
          mix assets.deploy
          mix release --overwrite
      - name: Validate deployment scripts
        if: matrix.project == 'evolving_minds'
        run: bash -n ../deploy/*.sh
      - name: Install browser verification dependencies
        if: matrix.project == 'evolving_minds'
        working-directory: e2e
        run: npm ci --ignore-scripts
      - name: Audit browser verification dependencies
        if: matrix.project == 'evolving_minds'
        working-directory: e2e
        run: npm audit --audit-level=high
      - name: Install Chromium for browser regressions
        if: matrix.project == 'evolving_minds'
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Verify product flows and responsive layouts in Chromium
        if: matrix.project == 'evolving_minds'
        working-directory: e2e
        run: npm test
      - name: Retain browser screenshots, accessibility reports and failure traces
        if: always() && matrix.project == 'evolving_minds'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: e2e/test-results/
          retention-days: 7
          include-hidden-files: false
          if-no-files-found: ignore
